global:
  scrape_interval: 5s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'backend-api'
    static_configs:
      - targets: ['backend-api:8080']
    metrics_path: /metrics

  - job_name: 'worker-transfer'
    static_configs:
      - targets: ['worker-transfer-agent:9094']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics
