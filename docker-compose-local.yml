services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_password --raw ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - unbound_local
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unbound_future_db
      POSTGRES_USER: unbound_future
      POSTGRES_PASSWORD: Unbound_future618
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbound_future -d unbound_future_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - unbound_local
    restart: always

  backend-api:
    build:
      context: ./backend/go-app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.yaml:/app/config.yaml
    environment:
      - GIN_MODE=debug
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/metrics >/dev/null || exit 1"]
      interval: 10s
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - unbound_local
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-api
    networks:
      - unbound_local
    restart: unless-stopped

  worker-downloader-py:
    build:
      context: ./backend/worker_downloader
      dockerfile: Dockerfile
    command: ["python", "get_yt_metadata.py"]
    environment:
      - BACKEND_API_URL=http://backend-api:8080/api
      - MACHINE_NAME=yt-node-local
      - METADATA_MAX_THREADS=16
      - METADATA_TASK_MAX_ATTEMPTS=3
      - METADATA_TASK_RETRY_BACKOFF_SECONDS=5
      - YT_DLP_AUTO_UPDATE_ENABLED=0
    volumes:
      - ./config/config.yaml:/app/config.yaml
      - ./backend/worker_downloader/get_yt_metadata.py:/app/get_yt_metadata.py
      - ./backend/worker_downloader/list_youtube_formats.py:/app/list_youtube_formats.py
    depends_on:
      - backend-api
    networks:
      - unbound_local
    restart: unless-stopped

  worker-transfer-scanner:
    build:
      context: ./backend/worker_transfer
      dockerfile: Dockerfile
    command: ["scanner"]
    environment:
      - BACKEND_API_URL=http://backend-api:8080/api
    volumes:
      - ./config/config.yaml:/app/config.yaml
    depends_on:
      - backend-api
    networks:
      - unbound_local
    restart: unless-stopped

  proxy-tester:
    build:
      context: .
      dockerfile: backend/proxy_tester/Dockerfile
    volumes:
      - ./config/config.yaml:/root/config.yaml
    networks:
      - unbound_local
    restart: unless-stopped

  worker-downloader-go:
    build:
      context: ./backend/worker_downloader
      dockerfile: Dockerfile
    command: ["downloader"]
    environment:
      - BACKEND_API_URL=http://backend-api:8080/api
      - MACHINE_NAME=yt-node-local
      - USE_PROXY=false
      - DOWNLOAD_MAX_CONCURRENT_WORKERS=32
      - DOWNLOAD_CONCURRENT_CHUNKS_PER_FILE=2
      - DOWNLOAD_REQUESTS_PER_MINUTE=1800
      - DOWNLOAD_TASK_BUFFER_SIZE=100
      - DOWNLOAD_CHUNK_SIZE=67108864
    volumes:
      - ./config/config.yaml:/app/config.yaml
    depends_on:
      - backend-api
    networks:
      - unbound_local
    restart: unless-stopped

  worker-transfer-agent:
    build:
      context: ./backend/worker_transfer
      dockerfile: Dockerfile
    command: ["transfer"]
    ports:
      - "9094:9094"
    environment:
      - BACKEND_API_URL=http://backend-api:8080/api
      - TRANSFER_MAX_WORKERS=32
      - TRANSFER_TASK_BUFFER=64
      - TRANSFER_PART_CONCURRENCY=8
      - TRANSFER_MULTIPART_THRESHOLD_MB=16
      - TRANSFER_MIN_PART_SIZE_MB=8
      - TRANSFER_MAX_CONNECTIONS=512
      - TRANSFER_MAX_RETRY_COUNT=2
      - TRANSFER_RETRY_BASE_DELAY_SECS=30
      - TRANSFER_RETRY_SCANNER_INTERVAL_SECS=30
      - TRANSFER_MIN_TIMEOUT_SECS=30
      - TRANSFER_MAX_TIMEOUT_SECS=3600
      - TRANSFER_MIN_THROUGHPUT_MBPS=2
      - TRANSFER_CHUNK_READ_TIMEOUT_SECS=30
      - TRANSFER_ADAPTIVE_CONCURRENCY_ENABLED=true
      - TRANSFER_MIN_WORKERS=4
      - TRANSFER_CONCURRENCY_INCREASE_STEP=1
      - TRANSFER_CONCURRENCY_DECREASE_FACTOR=0.5
      - TRANSFER_ERROR_RATE_THRESHOLD=0.10
      - TRANSFER_AVG_LATENCY_THRESHOLD_MS=3000
      - TRANSFER_CONN_POOL_UTILIZATION_THRESHOLD=0.85
      - TRANSFER_CONCURRENCY_ADJUST_INTERVAL_SECS=10
      - TRANSFER_CONCURRENCY_COOLDOWN_SECS=30
    volumes:
      - ./config/config.yaml:/app/config.yaml
    depends_on:
      - backend-api
    networks:
      - unbound_local
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_local:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - worker-transfer-agent
    networks:
      - unbound_local
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data_local:/var/lib/grafana
      - ./config/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
    networks:
      - unbound_local
    restart: unless-stopped

networks:
  unbound_local:
    driver: bridge

volumes:
  redis_data_local:
  postgres_data_local:
  prometheus_data_local:
  grafana_data_local: